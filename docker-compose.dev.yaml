# Lokale Entwicklung mit Hot Reload
# Start: docker compose -f docker-compose.dev.yaml up
# App:   http://localhost:5173  (Vite Dev Server)
# API:   http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    container_name: mitfahr-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: mitfahr_io
      POSTGRES_USER: mitfahr
      POSTGRES_PASSWORD: mitfahr_secret
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitfahr -d mitfahr_io"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:20-alpine
    container_name: mitfahr-dev
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - uploads_dev:/app/uploads
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mitfahr_io
      POSTGRES_USER: mitfahr
      POSTGRES_PASSWORD: mitfahr_secret
      JWT_SECRET: dev-secret-change-in-production
      APP_BASE_URL: http://localhost:3000
      REGISTRATION_ENABLED: "true"
      EMAIL_VERIFICATION_REQUIRED: "false"
      ALLOW_DEV_RESET_LINK: "1"
      ADMIN_EMAIL: nagraszust@gmail.com
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data_dev:
  app_node_modules:
  uploads_dev:
