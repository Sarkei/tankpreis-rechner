services:
  postgres:
    image: postgres:16-alpine
    container_name: mitfahr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mitfahr_io
      POSTGRES_USER: mitfahr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mitfahr_secret_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitfahr -d mitfahr_io"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mitfahr-io:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mitfahr-io
    restart: unless-stopped
    ports:
      - "${APP_PORT:-22225}:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./.env:/app/.env
      - uploads_data:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TRUST_PROXY=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mitfahr_io
      - POSTGRES_USER=mitfahr
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mitfahr_secret_change_me}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production-32chars-min}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:22225}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@mitfahr.io}
      - ALLOW_DEV_RESET_LINK=${ALLOW_DEV_RESET_LINK:-0}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-nagraszust@gmail.com}
      - DEBT_OVERDUE_DAYS=${DEBT_OVERDUE_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - cloudflare
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  uploads_data:

networks:
  internal:
    driver: bridge
  cloudflare:
    external: true
    name: cloudflare-tunnel-net
