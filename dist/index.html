    <title>MitFahr.io</title>
    <script>
      // Theme vor dem ersten Aufbau setzen, damit nichts aufblitzt.
      (function () {
        try {
          var stored = localStorage.getItem("mitfahr-theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
